name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS Archive & IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Find and Build Project
        run: |
          PROJ_PATH=$(find . -name "ZutrittApp.xcodeproj" | head -n 1)
          if [ -z "$PROJ_PATH" ]; then
            echo "FEHLER: ZutrittApp.xcodeproj nicht gefunden!"
            echo "Verzeichnisinhalt:"
            find . -maxdepth 3
            exit 1
          fi
          echo "Gefundenes Projekt: $PROJ_PATH"
          PROJ_DIR=$(dirname "$PROJ_PATH")
          cd "$PROJ_DIR"
          
          xcodebuild clean archive \
            -project "ZutrittApp.xcodeproj" \
            -scheme ZutrittApp \
            -configuration Release \
            -archivePath build/ZutrittApp.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Export Payload to IPA
        run: |
          ARCHIVE_PATH=$(find . -name "ZutrittApp.xcarchive" | head -n 1)
          if [ -z "$ARCHIVE_PATH" ]; then
            echo "FEHLER: ZutrittApp.xcarchive nicht gefunden!"
            exit 1
          fi
          BUILD_DIR=$(dirname "$ARCHIVE_PATH")
          mkdir -p "$BUILD_DIR/Payload"
          cp -r "$ARCHIVE_PATH/Products/Applications/ZutrittApp.app" "$BUILD_DIR/Payload/"
          cd "$BUILD_DIR"
          zip -r ZutrittApp-unsigned.ipa Payload
          echo "IPA erfolgreich erstellt!"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZutrittApp-iOS-12-plus
          path: "**/ZutrittApp-unsigned.ipa"
